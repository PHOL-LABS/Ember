<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ember</title><style>body{font:16px system-ui;max-width:42rem;margin:3rem auto;padding:0 1rem;background:#151515;color:#eee}section{background:#242424;border-radius:12px;padding:1.25rem;margin:1rem 0}dl{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}dd{font-variant-numeric:tabular-nums}button{padding:.6rem 1rem}.muted{color:#aaa}</style></head><body><h1>Ember</h1><p class="muted">RPM and speedometer signal converter</p><section><h2>Live inputs</h2><dl><dt>RPM frequency</dt><dd id="rpm">—</dd><dt>Speed frequency</dt><dd id="speed">—</dd><dt>RPM ADC</dt><dd id="rpmAdc">—</dd><dt>Speed ADC</dt><dd id="speedAdc">—</dd></dl></section><section><h2>Firmware update</h2><input id="firmware" type="file" accept=".bin"><button id="upload">Install</button><p id="result"></p></section><script>async function refresh(){try{const s=await(await fetch('/api/status')).json();rpm.textContent=s.rpm_hz.toFixed(2)+' Hz';speed.textContent=s.speed_hz.toFixed(2)+' Hz';rpmAdc.textContent=s.rpm_adc;speedAdc.textContent=s.speed_adc}catch{}}setInterval(refresh,500);refresh();upload.onclick=async()=>{const f=firmware.files[0];if(!f)return;result.textContent='Uploading…';const r=await fetch('/api/ota',{method:'POST',body:f});result.textContent=await r.text()}</script></body></html>
